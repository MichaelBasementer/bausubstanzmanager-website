<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <!-- Hintergrund -->
  <rect width="1000" height="600" fill="#F4F1FE"/>
  
  <!-- Smartphone Rahmen -->
  <rect x="350" y="50" width="300" height="500" rx="40" fill="#1E1742"/>
  <rect x="360" y="60" width="280" height="480" rx="32" fill="#FFFFFF"/>
  
  <!-- Status Bar -->
  <rect x="370" y="70" width="260" height="30" rx="4" fill="#1E1742"/>
  <circle cx="385" cy="85" r="4" fill="#FFFFFF"/>
  <text x="430" y="88" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">9:41</text>
  <circle cx="495" cy="85" r="4" fill="#FFFFFF"/>
  <circle cx="505" cy="85" r="4" fill="#FFFFFF"/>
  <circle cx="515" cy="85" r="4" fill="#FFFFFF"/>
  
  <!-- App Header -->
  <rect x="370" y="110" width="260" height="50" rx="8" fill="#512BD4"/>
  <text x="500" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" font-weight="bold">BausubstanzManager</text>
  
  <!-- Projektliste -->
  <rect x="370" y="180" width="260" height="60" rx="8" fill="#F4F1FE" stroke="#512BD4" stroke-width="2"/>
  <circle cx="390" cy="210" r="6" fill="#512BD4"/>
  <rect x="410" y="205" width="150" height="12" rx="4" fill="#1E1742"/>
  <rect x="410" y="225" width="100" height="8" rx="4" fill="#6C6791" opacity="0.7"/>
  
  <rect x="370" y="250" width="260" height="60" rx="8" fill="#F4F1FE" stroke="#6C6791" stroke-width="1"/>
  <circle cx="390" cy="280" r="6" fill="#6C6791"/>
  <rect x="410" y="275" width="150" height="12" rx="4" fill="#1E1742"/>
  <rect x="410" y="295" width="100" height="8" rx="4" fill="#6C6791" opacity="0.7"/>
  
  <rect x="370" y="320" width="260" height="60" rx="8" fill="#F4F1FE" stroke="#6C6791" stroke-width="1"/>
  <circle cx="390" cy="350" r="6" fill="#6C6791"/>
  <rect x="410" y="345" width="150" height="12" rx="4" fill="#1E1742"/>
  <rect x="410" y="365" width="100" height="8" rx="4" fill="#6C6791" opacity="0.7"/>
  
  <!-- Bottom Navigation -->
  <rect x="370" y="420" width="260" height="50" rx="8" fill="#1E1742"/>
  <circle cx="400" cy="445" r="6" fill="#FFFFFF"/>
  <text x="400" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF">Projekte</text>
  
  <circle cx="470" cy="445" r="6" fill="#6C6791"/>
  <text x="470" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6C6791">Karte</text>
  
  <circle cx="540" cy="445" r="6" fill="#6C6791"/>
  <text x="540" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6C6791">Fotos</text>
  
  <circle cx="610" cy="445" r="6" fill="#6C6791"/>
  <text x="610" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6C6791">Einst.</text>
  
  <!-- Hinweis -->
  <text x="500" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6C6791">
    BausubstanzManager Mobile App – Platzhalter
  </text>
  <text x="500" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6C6791" opacity="0.7">
