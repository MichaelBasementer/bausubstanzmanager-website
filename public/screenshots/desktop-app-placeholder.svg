<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <!-- Hintergrund -->
  <rect width="1000" height="600" fill="#F4F1FE"/>
  
  <!-- Desktop Fenster -->
  <rect x="150" y="50" width="700" height="450" rx="12" fill="#FFFFFF" stroke="#512BD4" stroke-width="2"/>
  
  <!-- Fenster Header -->
  <rect x="150" y="50" width="700" height="50" rx="12" fill="#512BD4"/>
  <circle cx="170" cy="75" r="6" fill="#FFFFFF"/>
  <circle cx="190" cy="75" r="6" fill="#FFFFFF"/>
  <circle cx="210" cy="75" r="6" fill="#FFFFFF"/>
  <text x="500" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold">BausubstanzManager Desktop</text>
  
  <!-- Menüleiste -->
  <rect x="160" y="110" width="680" height="30" rx="4" fill="#F4F1FE"/>
  <text x="180" y="130" font-family="Arial, sans-serif" font-size="12" fill="#1E1742">Datei</text>
  <text x="230" y="130" font-family="Arial, sans-serif" font-size="12" fill="#1E1742">Bearbeiten</text>
  <text x="310" y="130" font-family="Arial, sans-serif" font-size="12" fill="#1E1742">Ansicht</text>
  <text x="370" y="130" font-family="Arial, sans-serif" font-size="12" fill="#1E1742">Projekte</text>
  <text x="450" y="130" font-family="Arial, sans-serif" font-size="12" fill="#1E1742">Berichte</text>
  
  <!-- Sidebar -->
  <rect x="160" y="150" width="180" height="300" rx="8" fill="#F4F1FE" stroke="#6C6791" stroke-width="1"/>
  <rect x="170" y="160" width="160" height="30" rx="4" fill="#512BD4"/>
  <text x="250" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">Projektliste</text>
  
  <rect x="170" y="200" width="160" height="30" rx="4" fill="#F4F1FE" stroke="#6C6791" stroke-width="1"/>
  <circle cx="180" cy="215" r="4" fill="#512BD4"/>
  <text x="200" y="220" font-family="Arial, sans-serif" font-size="12" fill="#1E1742">Haus Müller</text>
  
  <rect x="170" y="240" width="160" height="30" rx="4" fill="#F4F1FE" stroke="#6C6791" stroke-width="1"/>
  <circle cx="180" cy="255" r="4" fill="#6C6791"/>
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="12" fill="#1E1742">Bürokomplex</text>
  
  <rect x="170" y="280" width="160" height="30" rx="4" fill="#F4F1FE" stroke="#6C6791" stroke-width="1"/>
  <circle cx="180" cy="295" r="4" fill="#6C6791"/>
  <text x="200" y="300" font-family="Arial, sans-serif" font-size="12" fill="#1E1742">Schule</text>
  
  <!-- Hauptbereich -->
  <rect x="360" y="150" width="470" height="300" rx="8" fill="#FFFFFF"/>
  
  <!-- Karte -->
  <rect x="370" y="160" width="450" height="180" rx="8" fill="#F4F1FE" stroke="#6C6791" stroke-width="1"/>
  <rect x="380" y="170" width="430" height="160" rx="4" fill="#FFFFFF"/>
  
  <!-- Gebäudeumrisse -->
  <rect x="400" y="190" width="120" height="80" rx="4" fill="#512BD4" opacity="0.3" stroke="#2B0B98" stroke-width="2"/>
  <circle cx="460" cy="230" r="8" fill="#2B0B98"/>
  <text x="460" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2B0B98">Bohrung A</text>
  
  <rect x="550" y="210" width="100" height="60" rx="4" fill="#512BD4" opacity="0.3" stroke="#2B0B98" stroke-width="2"/>
  <circle cx="600" cy="240" r="8" fill="#2B0B98"/>
  <text x="600" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2B0B98">Bohrung B</text>
  
  <!-- Datenbereich -->
  <rect x="370" y="360" width="450" height="80" rx="8" fill="#F4F1FE" stroke="#6C6791" stroke-width="1"/>
  <text x="380" y="380" font-family="Arial, sans-serif" font-size="14" fill="#1E1742" font-weight="bold">Projektstatistik</text>
  <rect x="380" y="400" width="100" height="20" rx="4" fill="#512BD4"/>
  <text x="430" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF">12 Räume</text>
  
  <rect x="500" y="400" width="100" height="20" rx="4" fill="#2B0B98"/>
  <text x="550" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF">45 Proben</text>
  
  <rect x="620" y="400" width="100" height="20" rx="4" fill="#6C6791"/>
  <text x="670" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FFFFFF">3 Berichte</text>
  
  <!-- Hinweis -->
  <text x="500" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6C6791">
    BausubstanzManager Desktop – Platzhalter
  </text>
  <text x="500" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6C6791" opacity="0.7">
    Ersetze durch echten Screenshot
  </text>
</svg>